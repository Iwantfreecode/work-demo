<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งล่วงหน้า | กาแฟเหมือนเดิม (live test)</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="สั่งกาแฟล่วงหน้า มาถึงรับได้เลย ร้านได้รับออเดอร์ทาง LINE ทันที">
  <meta property="og:title" content="สั่งล่วงหน้า กาแฟเหมือนเดิม">
  <meta property="og:description" content="เลือกเมนู ใส่ชื่อ เลือกเวลารับ ร้านได้ออเดอร์ทาง LINE ทันที">
  <meta property="og:image" content="https://iwantfreecode.github.io/work-demo/cafe-c/img/share.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;700&family=Pridi:wght@600&display=swap" rel="stylesheet">

  <style>
    :root { --brand: #24392D; --text: #222; --muted: #707070; --line: #E6E6E6; --tint: #F4F2EE; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Anuphan", sans-serif; color: var(--text); background: var(--tint); line-height: 1.6; }
    .nb { white-space: nowrap; }

    header { background: var(--brand); color: #fff; text-align: center; padding: 18px 16px; }
    header .name { font-family: "Pridi", serif; font-size: 1.5rem; }
    header p { font-size: .9rem; opacity: .85; }
    .en { display: block; font-size: .82em; color: var(--muted); font-weight: 400; }   /* English line under Thai */
    header .en { color: inherit; opacity: .8; }

    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 120px; }
    .box { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 14px; }
    h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; }

    /* Menu rows: name + price on the left, - qty + on the right */
    .item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .item:last-child { border-bottom: 0; }
    .item .price { color: var(--muted); font-size: .9rem; }
    .qty { display: flex; align-items: center; gap: 10px; }
    .qty button { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--brand); background: #fff; color: var(--brand); font-size: 1.2rem; cursor: pointer; }
    .qty .n { min-width: 1.2em; text-align: center; font-weight: 700; }
    .item.on .name { font-weight: 700; }

    label { display: block; font-size: .92rem; margin: 12px 0 4px; }
    input, select, textarea { width: 100%; font: inherit; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); }
    .hp { position: absolute; left: -9999px; }   /* hidden spam trap */

    /* Pickup: two big buttons, ASAP or order for later */
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .seg button { min-height: 52px; padding: 8px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; font: inherit; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
    .seg button[aria-pressed="true"] .en { color: #fff; opacity: .85; }
    .seg button:disabled { background: var(--tint); color: #aaa; cursor: default; }
    .hint { font-size: .88rem; color: var(--muted); margin-top: 8px; }

    /* Sticky bar at the bottom with total + send button */
    .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .bar-inner { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
    .bar .total { font-size: 1.15rem; font-weight: 700; }
    .bar .total small { display: block; font-weight: 400; font-size: .8rem; color: var(--muted); }
    .send { flex: 1; padding: 14px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .send:disabled { background: #B9B9B9; cursor: default; }
    button:focus-visible { outline: 3px solid #06C755; outline-offset: 2px; }

    .error { color: #C0392B; font-size: .9rem; margin-top: 10px; min-height: 1.2em; }

    /* Result screen */
    .done { display: none; text-align: center; }
    .done.show { display: block; }
    .done .big { font-family: "Pridi", serif; font-size: 2.6rem; color: var(--brand); }

    /* Demo preview: looks like the LINE chat the shop receives */
    .chat { background: #8CABD9; border-radius: 10px; padding: 14px; text-align: left; margin-top: 14px; }
    .chat .who { color: #fff; font-size: .8rem; margin-bottom: 6px; }
    .bubble { background: #fff; border-radius: 16px; border-top-left-radius: 4px; padding: 10px 14px; white-space: pre-line; font-size: .95rem; max-width: 92%; }
    .demo-note { font-size: .85rem; color: var(--muted); margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="name">เหมือนเดิม</div>
    <p>สั่งล่วงหน้า มาถึงรับได้เลย ไม่ต้องต่อคิว<br><span class="en">Order ahead, skip the queue</span></p>
  </header>

  <main>
    <form id="form" novalidate>
      <div class="box">
        <h2>เลือกเมนู <span class="en">Choose drinks</span></h2>
        <div id="menu"></div>
      </div>

      <div class="box">
        <h2>ข้อมูลผู้สั่ง <span class="en">Your details</span></h2>
        <label for="name">ชื่อ <span class="en">Name</span></label>
        <input id="name" autocomplete="given-name" maxlength="50" required>
        <label for="phone">เบอร์โทร <span class="en">Phone</span></label>
        <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="12" placeholder="08x-xxx-xxxx" required>
        <label id="pickup-label">เวลารับ <span class="en">Pickup</span></label>
        <div class="seg" role="group" aria-labelledby="pickup-label">
          <button type="button" id="mode-asap" data-mode="asap" aria-pressed="true">รับเลย<span class="en">ASAP</span></button>
          <button type="button" id="mode-later" data-mode="later" aria-pressed="false">สั่งล่วงหน้า<span class="en">Order for later</span></button>
        </div>
        <div class="hint" id="pickup-hint"></div>
        <div id="later-fields" hidden>
          <label for="pdate">วันที่ <span class="en">Date</span></label>
          <select id="pdate"></select>
          <label for="ptime">เวลา <span class="en">Time</span></label>
          <select id="ptime"></select>
        </div>
        <label for="note">หมายเหตุ (ถ้ามี) <span class="en">Note (optional)</span></label>
        <textarea id="note" rows="2" maxlength="120" placeholder="เช่น หวานน้อย / e.g. less sweet"></textarea>
        <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="error" id="error" role="alert"></div>
      </div>
    </form>

    <div class="box done" id="done" aria-live="polite"></div>
  </main>

  <div class="bar" id="bar">
    <div class="bar-inner">
      <div class="total"><span id="total">0</span> บาท<small id="count">ยังไม่ได้เลือก / None yet</small></div>
      <button class="send" id="send" form="form" disabled>ส่งออเดอร์ / Send order</button>
    </div>
  </div>

  <script>
    /* ---------- Settings ----------
       SCRIPT_URL: the Apps Script web app address (from Deploy → New deployment).
       Leave it empty and the page runs in DEMO mode: nothing is sent,
       it just shows the LINE message the shop would get. */
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz5edy9XEBrk8argF2hgVFSm_-C39S9FmlKRXO-zHdSECI9hg201WRQx3oZXWvx6H63/exec";
    // Pickup rules. Code.gs has the same numbers at the top: change both together.
    const OPEN = 7, CLOSE = 16;       // pickup times offered, in hours
    const PREP = 15;                  // minutes the shop needs to make an order
    const SLOT = 15;                  // later pickups are every 15 minutes
    const DAYS_AHEAD = 7;             // "order for later" up to 7 days ahead

    // Same ids as MENU in Code.gs. Prices here are only for showing the total;
    // the script recalculates them, so editing this page can't change what's charged.
    const MENU = [
      { id: "oliang",     name: "โอเลี้ยง",        en: "Oliang",           price: 45 },
      { id: "icedcoffee", name: "กาแฟเย็นแก้วโหล", en: "Thai iced coffee", price: 55 },
      { id: "icedlatte",  name: "ลาเต้เย็น",        en: "Iced latte",       price: 65 },
      { id: "hotlatte",   name: "ลาเต้ร้อน",        en: "Hot latte",        price: 60 },
      { id: "americano",  name: "อเมริกาโน่",       en: "Americano",        price: 55 },
      { id: "thaitea",    name: "ชาไทย",           en: "Thai tea",         price: 50 },
    ];

    const qty = {};                 // { oliang: 2, ... }
    const $ = id => document.getElementById(id);

    /* ---------- Menu ---------- */
    $("menu").innerHTML = MENU.map(m => `
      <div class="item" id="row-${m.id}">
        <div><div class="name">${m.name} <span class="en">${m.en}</span></div><div class="price">${m.price} บาท</div></div>
        <div class="qty">
          <button type="button" data-id="${m.id}" data-step="-1" aria-label="ลด ${m.name}">−</button>
          <span class="n" id="n-${m.id}">0</span>
          <button type="button" data-id="${m.id}" data-step="1" aria-label="เพิ่ม ${m.name}">+</button>
        </div>
      </div>`).join("");

    $("menu").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      const id = b.dataset.id;
      qty[id] = Math.min(20, Math.max(0, (qty[id] || 0) + Number(b.dataset.step)));
      $("n-" + id).textContent = qty[id];
      $("row-" + id).classList.toggle("on", qty[id] > 0);
      updateTotal();
    });

    function chosen() {
      return MENU.filter(m => qty[m.id] > 0).map(m => ({ ...m, qty: qty[m.id] }));
    }

    function updateTotal() {
      const items = chosen();
      const total = items.reduce((s, m) => s + m.price * m.qty, 0);
      const cups = items.reduce((s, m) => s + m.qty, 0);
      $("total").textContent = total;
      $("count").textContent = cups ? `${cups} แก้ว / cups` : "ยังไม่ได้เลือก / None yet";
      $("send").disabled = cups === 0;
    }

    /* ---------- Pickup: ASAP or order for later (all times are Bangkok time) ---------- */
    const TH_DAYS = ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."], EN_DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const TH_MONTHS = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
    const EN_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    let mode = "asap";

    const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;

    // Today's date ("2026-11-28") and minutes since midnight, in Bangkok
    function bangkokNow() {
      const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Bangkok", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
      const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
      return { today: `${p.year}-${p.month}-${p.day}`, minutes: Number(p.hour) * 60 + Number(p.minute) };
    }

    // "2026-11-28" + 2 days → "2026-11-30". UTC is only used for counting days, so the weekday can't shift.
    function addDays(date, n) {
      const [y, m, d] = date.split("-").map(Number);
      return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
    }

    // "ส. 28 พ.ย. / Sat 28 Nov"
    function dayText(date) {
      const [y, m, d] = date.split("-").map(Number);
      const wd = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
      return `${TH_DAYS[wd]} ${d} ${TH_MONTHS[m - 1]} / ${EN_DAYS[wd]} ${d} ${EN_MONTHS[m - 1]}`;
    }

    // Free times on one day. Today starts PREP minutes from now, rounded up to the next slot.
    function slotsFor(date, now) {
      let from = OPEN * 60;
      if (date === now.today) from = Math.max(from, Math.ceil((now.minutes + PREP) / SLOT) * SLOT);
      const slots = [];
      for (let m = from; m <= CLOSE * 60; m += SLOT) slots.push(hhmm(m));
      return slots;
    }

    // Rebuild everything that depends on "now": ASAP on/off, the date list, the time list.
    function refreshPickup() {
      const now = bangkokNow();
      const asapOk = now.minutes >= OPEN * 60 && now.minutes + PREP <= CLOSE * 60;
      $("mode-asap").disabled = !asapOk;
      if (!asapOk) mode = "later";

      const keepDate = $("pdate").value;
      const dates = [];
      for (let i = 0; i <= DAYS_AHEAD; i++) {
        const date = addDays(now.today, i);
        if (slotsFor(date, now).length === 0) continue;       // e.g. today after closing
        const label = i === 0 ? "วันนี้ / Today" : i === 1 ? "พรุ่งนี้ / Tomorrow" : dayText(date);
        dates.push(`<option value="${date}">${label}</option>`);
      }
      $("pdate").innerHTML = dates.join("");
      if (keepDate && $("pdate").querySelector(`option[value="${keepDate}"]`)) $("pdate").value = keepDate;
      fillTimes(now);

      const open = `${hhmm(OPEN * 60)}–${hhmm(CLOSE * 60)}`;
      $("pickup-hint").textContent =
        mode === "asap" ? `พร้อมรับประมาณ ${hhmm(now.minutes + PREP)} น. / Ready in about ${PREP} min (~${hhmm(now.minutes + PREP)})`
        : asapOk ? ""
        : now.minutes >= OPEN * 60 && now.minutes < CLOSE * 60
          ? `ใกล้ปิดแล้ว รับเลยไม่ทัน / Too close to closing for ASAP`
          : `ร้านปิดอยู่ (เปิด ${open}) รับเลยไม่ได้ / Closed now (open ${open}), ASAP not available`;
      showMode();
    }

    function fillTimes(now) {
      const keepTime = $("ptime").value;
      const slots = slotsFor($("pdate").value, now || bangkokNow());
      $("ptime").innerHTML = slots.map(t => `<option>${t}</option>`).join("");
      if (slots.includes(keepTime)) $("ptime").value = keepTime;
    }

    function showMode() {
      $("mode-asap").setAttribute("aria-pressed", mode === "asap");
      $("mode-later").setAttribute("aria-pressed", mode === "later");
      $("later-fields").hidden = mode !== "later";
    }

    document.querySelector(".seg").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b || b.disabled) return;
      mode = b.dataset.mode;
      refreshPickup();
    });
    $("pdate").addEventListener("change", () => fillTimes());
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshPickup(); });
    refreshPickup();

    // What we send to the script: no free text, the script checks it again and writes the display text itself.
    function pickupData() {
      return mode === "asap" ? { type: "asap" } : { type: "later", date: $("pdate").value, time: $("ptime").value };
    }

    // Only for the demo preview. Live orders show the text the script sends back.
    function pickupText() {
      return mode === "asap" ? `รับเลย / ASAP ~${hhmm(bangkokNow().minutes + PREP)}` : `${dayText($("pdate").value)} ${$("ptime").value}`;
    }

    /* ---------- Send ---------- */
    $("form").addEventListener("submit", async e => {
      e.preventDefault();
      $("error").textContent = "";

      const order = {
        type: "order",
        name: $("name").value.trim(),
        phone: $("phone").value.replace(/\D/g, ""),
        pickup: pickupData(),
        note: $("note").value.trim(),
        website: $("website").value,                        // spam trap, should stay empty
        items: chosen().map(m => ({ id: m.id, qty: m.qty })),
      };

      if (!order.name) return showError("กรุณาใส่ชื่อ / Please enter your name");
      if (order.phone.length < 9 || order.phone.length > 10) return showError("เบอร์โทรไม่ถูกต้อง / Invalid phone number");

      if (order.pickup.type === "later" && !order.pickup.time) return showError("ไม่มีเวลาว่าง เลือกวันอื่น / No time left, pick another day");

      if (!SCRIPT_URL) return showDemo(order);

      $("send").disabled = true;
      $("send").textContent = "กำลังส่ง... / Sending...";
      try {
        // text/plain avoids an extra browser check that Apps Script can't answer
        const res = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(order) });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "ส่งไม่สำเร็จ / Could not send");
        showDone(data.id, data.total, data.pickup || pickupText());
      } catch (err) {
        showError(err.message.startsWith("Failed") ? "เน็ตมีปัญหา ลองใหม่อีกครั้ง / Connection problem, please try again" : err.message);
        $("send").disabled = false;
        $("send").textContent = "ส่งออเดอร์ / Send order";
      }
    });

    function showError(msg) { $("error").textContent = msg; }

    function showDone(id, total, pickup) {
      $("form").hidden = true; $("bar").hidden = true;
      $("done").innerHTML = `
        <p>ได้รับออเดอร์แล้ว <span class="en">Order received</span></p>
        <div class="big">#${id}</div>
        <p>ยอด ${total} บาท จ่ายตอนรับที่ร้าน <span class="en">Total ${total} baht, pay at pickup</span></p>
        <p class="demo-note">บอกเลขนี้ที่หน้าร้าน รับเวลา ${pickup}<br>Show this number at the counter, pickup ${pickup}</p>`;
      $("done").classList.add("show");
      window.scrollTo(0, 0);
    }

    // Demo mode: build the exact message Code.gs would push to the shop's LINE.
    function showDemo(o) {
      const items = chosen();
      const total = items.reduce((s, m) => s + m.price * m.qty, 0);
      const p = o.phone.length === 10 ? `${o.phone.slice(0,3)}-${o.phone.slice(3,6)}-${o.phone.slice(6)}` : o.phone;
      const msg =
        `🧾 ออเดอร์ใหม่ / New order #12\n${o.name} ${p}\n` +
        items.map(m => `• ${m.name} (${m.en}) x${m.qty}`).join("\n") +
        `\nรวม / Total: ${total} บาท\nรับเวลา / Pickup: ${pickupText()}` +
        (o.note ? `\nหมายเหตุ / Note: ${o.note}` : "") +
        `\n\nตอบ / Reply "รับ 12" หรือ / or "accept 12"`;

      $("form").hidden = true; $("bar").hidden = true;
      $("done").innerHTML = `
        <p>ลูกค้าเห็นหน้านี้ <span class="en">What the customer sees</span></p>
        <div class="big">#12</div>
        <p>ยอด ${total} บาท จ่ายตอนรับที่ร้าน <span class="en">Total ${total} baht, pay at pickup</span></p>
        <div class="chat">
          <div class="who">ร้านได้รับใน LINE ทันที / The shop gets this in LINE instantly</div>
          <div class="bubble"></div>
        </div>
        <p class="demo-note">โหมดตัวอย่าง ยังไม่ได้ส่งจริง ข้อมูลจะถูกบันทึกลง Google Sheets ด้วย<br>Demo mode: nothing was sent. Real orders are also saved to Google Sheets.</p>`;
      $("done").querySelector(".bubble").textContent = msg;   // textContent: whatever was typed is shown as plain text
      $("done").classList.add("show");
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
